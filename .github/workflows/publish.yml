name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify package distribution
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      validated_tag: ${{ steps.preflight.outputs.validated_tag }}
      validated_commit: ${{ steps.verify_tag.outputs.validated_commit }}
      artifacts_sha256: ${{ steps.checksums.outputs.artifacts_sha256 }}
    steps:
      - name: Preflight validate manual workflow_dispatch and candidate release tag format
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Error: Release workflow may only run via manual workflow_dispatch (got '$EVENT_NAME')." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: Manual release workflow_dispatch must be executed from 'refs/heads/main' (got '$GITHUB_REF')." >&2
            exit 1
          fi
          if [ -z "${INPUT_TAG:-}" ]; then
            echo "Error: inputs.tag is required for workflow_dispatch." >&2
            exit 1
          fi

          CANDIDATE_TAG="$INPUT_TAG"
          if [[ -z "$CANDIDATE_TAG" || "$CANDIDATE_TAG" =~ [[:space:]] ]]; then
            echo "Error: Release tag must not be empty or contain whitespace." >&2
            exit 1
          fi

          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$CANDIDATE_TAG" =~ $TAG_REGEX ]]; then
            echo "Error: Release tag '$CANDIDATE_TAG' does not match required anchored pattern $TAG_REGEX" >&2
            exit 1
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "validated_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify fetched tag ref equals origin/main HEAD before code checkout
        id: verify_tag
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          git -C "$VERIFY_DIR" init -q
          git -C "$VERIFY_DIR" remote add origin "$REPO_URL"
          git -C "$VERIFY_DIR" -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"

          if ! git -C "$VERIFY_DIR" rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Error: Release tag 'refs/tags/$TARGET_TAG' does not exist." >&2
            exit 1
          fi

          TAG_TYPE=$(git -C "$VERIFY_DIR" cat-file -t "refs/tags/$TARGET_TAG" 2>/dev/null || true)
          if [ "$TAG_TYPE" != "tag" ] && [ "$TAG_TYPE" != "commit" ]; then
            echo "Error: 'refs/tags/$TARGET_TAG' has unexpected git object type '$TAG_TYPE'." >&2
            exit 1
          fi

          TAG_COMMIT=$(git -C "$VERIFY_DIR" rev-parse --verify "refs/tags/$TARGET_TAG^{commit}" 2>/dev/null || true)
          MAIN_HEAD=$(git -C "$VERIFY_DIR" rev-parse --verify "refs/remotes/origin/main^{commit}" 2>/dev/null || true)
          if [[ ! "$TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: Failed to dereference tag to 40-hex commit SHA." >&2
            exit 1
          fi
          if [ "$TAG_COMMIT" != "$MAIN_HEAD" ]; then
            echo "Error: Tag commit ($TAG_COMMIT) does not equal current origin/main HEAD ($MAIN_HEAD)." >&2
            exit 1
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "validated_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify_tag.outputs.validated_commit }}
          fetch-depth: 0

      - name: Confirm checked-out HEAD matches verified tag commit
        env:
          EXPECTED_COMMIT: ${{ steps.verify_tag.outputs.validated_commit }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_COMMIT" ]; then
            echo "Error: Checked-out HEAD ($ACTUAL_HEAD) != verified commit ($EXPECTED_COMMIT)." >&2
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate pyproject.toml name and version match verified tag
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
        run: |
          set -euo pipefail
          python -c '
          import os, pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          ver = data["project"]["version"]
          target_tag = os.environ["TARGET_TAG"]
          if name != "patchdiff-mcp":
              raise SystemExit(f"Error: pyproject.toml name {name!r} must be '\''patchdiff-mcp'\''")
          if f"v{ver}" != target_tag:
              raise SystemExit(f"Error: Tag {target_tag!r} does not match pyproject.toml version {ver!r}")
          '

      - name: Verify Waymark bridge and packaged compose assets
        run: |
          set -euo pipefail
          for f in discover.mjs discovery_core.mjs worker.mjs package.json package-lock.json; do
            if [ ! -f "backend/app/waymark_bridge/$f" ]; then
              echo "Error: Missing required bridge asset backend/app/waymark_bridge/$f" >&2
              exit 1
            fi
          done
          if [ ! -f "backend/app/mcp/resources/docker-compose.yml" ]; then
            echo "Error: Missing packaged backend/app/mcp/resources/docker-compose.yml" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build --wheel --sdist

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Verify artifact filenames and wheel metadata match release version
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
        run: |
          set -euo pipefail
          VERSION="${TARGET_TAG#v}"
          WHEEL_FOUND=$(ls dist/patchdiff_mcp-"$VERSION"-*.whl 2>/dev/null || true)
          SDIST_FOUND=$(ls dist/patchdiff_mcp-"$VERSION".tar.gz 2>/dev/null || ls dist/patchdiff-mcp-"$VERSION".tar.gz 2>/dev/null || true)
          if [ -z "$WHEEL_FOUND" ] || [ -z "$SDIST_FOUND" ]; then
            echo "Error: Expected wheel/sdist for version $VERSION not found in dist/" >&2
            ls -la dist/
            exit 1
          fi
          WHEEL_PATH="$WHEEL_FOUND" EXPECTED_VERSION="$VERSION" python -c '
          import os, zipfile
          wheel_path = os.environ["WHEEL_PATH"]
          expected_ver = os.environ["EXPECTED_VERSION"]
          with zipfile.ZipFile(wheel_path) as zf:
              meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
              text = zf.read(meta).decode("utf-8")
              assert "Name: patchdiff-mcp" in text, text
              assert f"Version: {expected_ver}" in text, text
          '

      - name: Stage G clean dependency-resolved wheel two-process smoke test
        env:
          PATCHDIFF_WAYMARK_MODE: resident
          PATCHDIFF_TEST_EVIDENCE_DIR: ${{ github.workspace }}/.ci-results
        run: |
          set -euo pipefail
          python -m pip install -r requirements.lock
          export PATCHDIFF_TEST_WHEEL_PATH="$(realpath dist/patchdiff_mcp-*.whl)"
          python -m pytest backend/tests/integration/test_installed_wheel_smoke.py backend/tests/integration/test_adversarial_m4_wheel_smoke.py -q

      - name: Retain installed-artifact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-acceptance
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

      - name: Generate SHA-256 checksum manifest
        id: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          DIGEST=$(sha256sum SHA256SUMS.txt | awk '{print $1}')
          echo "artifacts_sha256=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build.outputs.validated_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/patchdiff-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify distribution artifacts and SHA-256 checksums
        env:
          EXPECTED_TAG: ${{ needs.build.outputs.validated_tag }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_TAG" ]; then
            echo "Error: Missing validated release tag from build job output." >&2
            exit 1
          fi
          VERSION="${EXPECTED_TAG#v}"
          cd dist
          ACTUAL_MANIFEST_SHA256=$(sha256sum SHA256SUMS.txt | awk '{print $1}')
          if [ "$ACTUAL_MANIFEST_SHA256" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "Error: SHA256SUMS.txt digest mismatch ($ACTUAL_MANIFEST_SHA256 != $EXPECTED_MANIFEST_SHA256)" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          rm -f SHA256SUMS.txt
          if ! ls patchdiff_mcp-"$VERSION"-*.whl 1>/dev/null 2>&1; then
            echo "Error: Downloaded artifacts missing wheel for $VERSION" >&2
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
