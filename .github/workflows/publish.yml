name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build package distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release tag and package version match
        run: |
          TARGET_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "Validating release tag: $TARGET_TAG"
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Error: Release tag $TARGET_TAG is not a valid version tag (expected v*.*.*)." >&2
            exit 1
          fi
          PY_VER=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$PY_VER" != "$TARGET_TAG" ]; then
            echo "Error: Tag $TARGET_TAG does not match pyproject.toml version v$PY_VER" >&2
            exit 1
          fi
          echo "Verified: Tag $TARGET_TAG matches pyproject.toml version $PY_VER"

      - name: Verify Waymark bridge package assets
        run: |
          for f in discover.mjs discovery_core.mjs worker.mjs package.json package-lock.json; do
            if [ ! -f "backend/app/waymark_bridge/$f" ]; then
              echo "Error: Missing required bridge asset backend/app/waymark_bridge/$f" >&2
              exit 1
            fi
          done
          echo "All Waymark bridge assets verified in backend/app/waymark_bridge/"

      - name: Install build dependencies
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Test installed wheel in clean environment
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          # Verify console script entry point exists and runs stdio JSON-RPC
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | /tmp/smoke-venv/bin/patchdiff | grep -q "patchdiff_commit_bundle"
          echo "Installed wheel MCP smoke test passed."

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/patchdiff-mcp
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

