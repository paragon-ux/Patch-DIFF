name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify package distribution
    runs-on: ubuntu-latest
    outputs:
      validated_tag: ${{ steps.preflight.outputs.validated_tag }}
      validated_commit: ${{ steps.verify_tag.outputs.validated_commit }}
      artifacts_sha256: ${{ steps.checksums.outputs.artifacts_sha256 }}
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: patchdiff
          POSTGRES_USER: patchdiff_release_test
          POSTGRES_PASSWORD: release_smoke_test_secret_9f8e7d6c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchdiff_release_test -d patchdiff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Preflight validate candidate release tag format
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_TAG:-}" ]; then
              echo "Error: inputs.tag is required for workflow_dispatch." >&2
              exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Error: Manual release workflow_dispatch must be executed from 'refs/heads/main' (got '$GITHUB_REF')." >&2
              exit 1
            fi
            CANDIDATE_TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            CANDIDATE_TAG="$REF_NAME"
          else
            echo "Error: Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "Preflight validating candidate tag format: $CANDIDATE_TAG"

          # Strictly reject empty, control characters, or whitespace
          if [[ -z "$CANDIDATE_TAG" || "$CANDIDATE_TAG" =~ [[:space:]] ]]; then
            echo "Error: Release tag must not be empty or contain whitespace." >&2
            exit 1
          fi

          # Strict anchored regex matching: ^v[0-9]+\.[0-9]+\.[0-9]+$
          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$CANDIDATE_TAG" =~ $TAG_REGEX ]]; then
            echo "Error: Release tag '$CANDIDATE_TAG' does not match required anchored pattern $TAG_REGEX" >&2
            exit 1
          fi

          echo "Candidate tag format is valid: $CANDIDATE_TAG"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "validated_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "TARGET_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release tag ref and provenance on main
        id: verify_tag
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
        run: |
          set -euo pipefail
          echo "Verifying git tag refs/tags/$TARGET_TAG"

          # 1. Synchronize remote tags
          git fetch origin "+refs/tags/*:refs/tags/*" --tags || true

          # 2. Verify release tag exists as a ref
          if ! git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Error: Release tag 'refs/tags/$TARGET_TAG' does not exist in repository." >&2
            exit 1
          fi

          # 3. Verify object type is annotated tag ('tag') or lightweight tag ('commit')
          TAG_TYPE=$(git cat-file -t "refs/tags/$TARGET_TAG" 2>/dev/null || true)
          if [ "$TAG_TYPE" != "tag" ] && [ "$TAG_TYPE" != "commit" ]; then
            echo "Error: 'refs/tags/$TARGET_TAG' is of type '$TAG_TYPE'; expected annotated tag or lightweight tag." >&2
            exit 1
          fi
          echo "Verified tag object type: $TAG_TYPE"

          # 4. Dereference tag to its immutable 40-character commit SHA
          TAG_COMMIT=$(git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}" 2>/dev/null || true)
          if [[ ! "$TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: Failed to dereference 'refs/tags/$TARGET_TAG' to a 40-character commit SHA." >&2
            exit 1
          fi
          echo "Dereferenced tag commit: $TAG_COMMIT"

          # 5. Verify the tag commit is an immutable commit on the approved branch (origin/main)
          APPROVED_REF="origin/main"
          if ! git rev-parse -q --verify "$APPROVED_REF" >/dev/null; then
            APPROVED_REF="main"
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$APPROVED_REF"; then
            echo "Error: Tag commit $TAG_COMMIT is not an ancestor of approved branch $APPROVED_REF." >&2
            exit 1
          fi
          echo "Verified: Tag commit $TAG_COMMIT is in the approved branch ($APPROVED_REF) history."

          # 6. Checkout the exact verified tag commit (detached HEAD)
          git checkout -q "$TAG_COMMIT"

          # 7. Verify HEAD exactly matches the verified tag commit SHA
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$TAG_COMMIT" ]; then
            echo "Error: Checked out HEAD ($CURRENT_HEAD) does not match verified tag commit ($TAG_COMMIT)." >&2
            exit 1
          fi
          echo "Verified checked-out HEAD matches tag commit: $CURRENT_HEAD"

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "validated_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "TARGET_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate pyproject.toml name and version match verified tag
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
        run: |
          set -euo pipefail
          PY_NAME=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["name"])')
          PY_VER=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')
          if [ "$PY_NAME" != "patchdiff-mcp" ]; then
            echo "Error: pyproject.toml name '$PY_NAME' must be 'patchdiff-mcp'." >&2
            exit 1
          fi
          EXPECTED_TAG="v$PY_VER"
          if [ "$EXPECTED_TAG" != "$TARGET_TAG" ]; then
            echo "Error: Tag '$TARGET_TAG' does not match pyproject.toml version '$PY_VER' (expected '$EXPECTED_TAG')." >&2
            exit 1
          fi
          echo "Verified: Package $PY_NAME and tag $TARGET_TAG match pyproject.toml version $PY_VER"

      - name: Verify Waymark bridge and packaged compose assets
        run: |
          set -euo pipefail
          for f in discover.mjs discovery_core.mjs worker.mjs package.json package-lock.json; do
            if [ ! -f "backend/app/waymark_bridge/$f" ]; then
              echo "Error: Missing required bridge asset backend/app/waymark_bridge/$f" >&2
              exit 1
            fi
          done
          if [ ! -f "backend/app/mcp/resources/docker-compose.yml" ]; then
            echo "Error: Missing packaged backend/app/mcp/resources/docker-compose.yml" >&2
            exit 1
          fi
          echo "All Waymark bridge and runtime compose assets verified."

      - name: Install build dependencies
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Verify artifact filenames and wheel metadata match release version
        env:
          TARGET_TAG: ${{ steps.preflight.outputs.validated_tag }}
        run: |
          set -euo pipefail
          VERSION="${TARGET_TAG#v}"
          WHEEL_FOUND=$(ls dist/patchdiff_mcp-"$VERSION"-*.whl 2>/dev/null || true)
          SDIST_FOUND=$(ls dist/patchdiff_mcp-"$VERSION".tar.gz 2>/dev/null || ls dist/patchdiff-mcp-"$VERSION".tar.gz 2>/dev/null || true)

          if [ -z "$WHEEL_FOUND" ]; then
            echo "Error: Expected wheel for version $VERSION not found in dist/" >&2
            ls -la dist/
            exit 1
          fi
          if [ -z "$SDIST_FOUND" ]; then
            echo "Error: Expected sdist for version $VERSION not found in dist/" >&2
            ls -la dist/
            exit 1
          fi
          python -c "
          import zipfile
          with zipfile.ZipFile('$WHEEL_FOUND') as zf:
              meta = [n for n in zf.namelist() if n.endswith('.dist-info/METADATA')][0]
              text = zf.read(meta).decode('utf-8')
              assert 'Name: patchdiff-mcp' in text, text
              assert 'Version: $VERSION' in text, text
          "
          echo "Verified built artifacts and wheel METADATA for patchdiff-mcp==$VERSION"

      - name: Test installed wheel in clean environment with Postgres and Waymark
        env:
          PATCHDIFF_DATABASE_URL: postgresql+psycopg://patchdiff_release_test:release_smoke_test_secret_9f8e7d6c@localhost:5432/patchdiff
          PATCHDIFF_WAYMARK_MODE: resident
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke-venv/bin/python -m app.waymark_bridge.bootstrap --target-dir /tmp/smoke-venv/waymark-bridge
          /tmp/smoke-venv/bin/python -m app.waymark_bridge.bootstrap --check-only --target-dir /tmp/smoke-venv/waymark-bridge
          # Run Alembic migrations from the installed wheel
          INI_PATH=$(/tmp/smoke-venv/bin/python -c "import app.mcp.runtime_cli as rc; print(rc.get_alembic_ini_path())")
          /tmp/smoke-venv/bin/python -m alembic -c "$INI_PATH" upgrade head
          # Execute end-to-end initialize -> observe_scopes -> commit_bundle -> finalize_target via installed wheel
          PATCHDIFF_WAYMARK_BRIDGE_DIR=/tmp/smoke-venv/waymark-bridge /tmp/smoke-venv/bin/python -c '
          import json, os, subprocess, uuid
          env_full = {**os.environ, "PATCHDIFF_MCP_PROFILE": "full"}
          env_v2 = {**os.environ, "PATCHDIFF_MCP_PROFILE": "observed_v2"}
          p_full = subprocess.Popen(["/tmp/smoke-venv/bin/patchdiff-mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, env=env_full)
          p_v2 = subprocess.Popen(["/tmp/smoke-venv/bin/patchdiff-mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, env=env_v2)
          def rpc(proc, i, name, args):
              proc.stdin.write(json.dumps({"jsonrpc":"2.0","id":i,"method":"tools/call","params":{"name":name,"arguments":args}}) + "\n")
              proc.stdin.flush()
              res = json.loads(proc.stdout.readline())
              assert not res["result"].get("isError"), res
              return json.loads(res["result"]["content"][0]["text"])
          try:
              init = rpc(p_full, 1, "patchdiff_initialize_target", {"filename":"rel.py","content":"def f():\n    return 1\n","content_type":"text/x-python"})
              tid = init["target_file_id"]
              obs = rpc(p_v2, 2, "patchdiff_observe_scopes", {"target_file_id":tid,"selections":[{"symbol_name":"f"}]})
              oid = obs["scopes"][0]["observation_id"]
              com = rpc(p_v2, 3, "patchdiff_commit_bundle", {"snapshot":obs["snapshot"],"intent":"update f","client_request_id":str(uuid.uuid4()),"groups":[{"observation_id":oid,"operations":[{"op":"match","match":"return 1","replace":"return 2"}]}]})
              assert com["status"] == "accepted"
              fin = rpc(p_full, 4, "patchdiff_finalize_target", {"target_file_id":tid,"expected_target_version":1,"client_request_id":str(uuid.uuid4())})
              assert fin["status"] == "ok" and "return 2" in fin["exported_content"]
          finally:
              p_full.terminate(); p_v2.terminate()
          '
          echo "Installed wheel full Postgres + Waymark + MCP lifecycle verification passed."

      - name: Generate SHA-256 checksum manifest
        id: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          DIGEST=$(sha256sum SHA256SUMS.txt | awk '{print $1}')
          echo "artifacts_sha256=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.validated_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/patchdiff-mcp
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify distribution artifacts and SHA-256 checksums
        env:
          EXPECTED_TAG: ${{ needs.build.outputs.validated_tag }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_TAG" ]; then
            echo "Error: Missing validated release tag from build job output." >&2
            exit 1
          fi
          VERSION="${EXPECTED_TAG#v}"
          echo "Publishing release version: $VERSION for tag: $EXPECTED_TAG"
          cd dist
          ls -la
          ACTUAL_MANIFEST_SHA256=$(sha256sum SHA256SUMS.txt | awk '{print $1}')
          if [ "$ACTUAL_MANIFEST_SHA256" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "Error: SHA256SUMS.txt digest mismatch ($ACTUAL_MANIFEST_SHA256 != $EXPECTED_MANIFEST_SHA256)" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          rm -f SHA256SUMS.txt
          if ! ls patchdiff_mcp-"$VERSION"-*.whl 1>/dev/null 2>&1; then
            echo "Error: Downloaded artifacts missing wheel for $VERSION" >&2
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
