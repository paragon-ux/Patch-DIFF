name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:backend
      PATCHDIFF_WAYMARK_MODE: resident
      PATCHDIFF_TEST_EVIDENCE_DIR: ${{ github.workspace }}/.ci-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision OS principals and PostgreSQL roles (Stage B)
        run: |
          set -euo pipefail
          if ! id -u patchdiff-mcp-agent >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin patchdiff-mcp-agent
          fi
          if ! id -u patchdiff-model >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin patchdiff-model
          fi
          sudo install -d -m 0700 -o patchdiff-mcp-agent -g patchdiff-mcp-agent /var/lib/patchdiff-mcp-agent
          echo "$USER ALL=(patchdiff-mcp-agent,patchdiff-model) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/patchdiff-ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/patchdiff-ci
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install build
          npm --prefix integrations/waymark ci
          chmod -R a+rX integrations/waymark backend/app/waymark_bridge
      - name: Provision disposable private Docker runtime and migrate
        run: |
          set -euo pipefail
          python backend/tests/ci_runtime.py setup
          python -c '
          from alembic import command
          from alembic.config import Config
          from app.core.config import resolve_database_url
          cfg=Config("backend/app/migrations/alembic.ini")
          cfg.attributes["database_url"]=resolve_database_url(role="patchdiff_bootstrap")
          command.downgrade(cfg,"-1")
          command.upgrade(cfg,"head")
          '
      - name: Unit tests
        run: python backend/tests/ci_runtime.py run python -m pytest backend/tests/unit --junitxml=.ci-results/unit.xml -ra
      - name: Resident worker lifecycle on Linux
        run: python backend/tests/ci_runtime.py run python -m pytest backend/tests/unit/test_waymark_worker.py --junitxml=.ci-results/worker-linux.xml -ra
      - name: Build release wheel and sdist from exact HEAD (Stage G)
        run: |
          set -euo pipefail
          mkdir -p .ci-results dist
          rm -rf dist/*
          python -m build --wheel --sdist --outdir dist
          sha256sum dist/*.whl dist/*.tar.gz | tee .ci-results/artifacts-sha256.txt
      - name: Postgres integration tests (including Stage G clean wheel two-process smoke)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: |
          export PATCHDIFF_TEST_WHEEL_PATH="$(realpath dist/patchdiff_mcp-*.whl)"
          python backend/tests/ci_runtime.py run python -m pytest backend/tests/integration --junitxml=.ci-results/integration-resident.xml -ra
      - name: Offline evaluation
        run: |
          set -euo pipefail
          python backend/tests/verification/offline_eval.py | tee .ci-results/offline-eval.txt
      - name: Deterministic five-file verification (resident)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: python backend/tests/ci_runtime.py run python backend/tests/verification/structural_batch/verify.py --output .ci-results/five-file
      - name: Four-tool delegated editor and trusted scalar finalization (five files)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
          PATCHDIFF_MCP_RESPONSE_MODE: compact
        run: python backend/tests/ci_runtime.py run python backend/tests/verification/structural_batch/verify.py --host-finalize --output .ci-results/five-file-compact-host
      - name: Versioned editor interface and trusted scalar finalization (five files)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: python backend/tests/ci_runtime.py run python backend/tests/verification/structural_batch/verify.py --editor-v2 --host-finalize --output .ci-results/five-file-v2
      - name: Build documentation site check
        run: |
          pip install -r docs-requirements.lock
          zensical build --clean
      - name: Executed source and environment
        if: always()
        run: |
          mkdir -p .ci-results
          git rev-parse HEAD > .ci-results/executed-source.txt
          python --version > .ci-results/environment.txt
          node --version >> .ci-results/environment.txt
          uname -a >> .ci-results/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-waymark-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
