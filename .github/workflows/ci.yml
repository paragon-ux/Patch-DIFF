name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: patchdiff
          POSTGRES_USER: patchdiff
          POSTGRES_PASSWORD: patchdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchdiff -d patchdiff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PATCHDIFF_DATABASE_URL: postgresql+psycopg://patchdiff:patchdiff@localhost:5432/patchdiff
      PYTHONPATH: .:backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          npm --prefix integrations/waymark ci
      - name: Migrate (upgrade, downgrade one step, upgrade again)
        run: |
          alembic -c backend/app/migrations/alembic.ini upgrade head
          alembic -c backend/app/migrations/alembic.ini downgrade -1
          alembic -c backend/app/migrations/alembic.ini upgrade head
      - name: Unit tests
        run: pytest backend/tests/unit --junitxml=.ci-results/unit.xml -ra
      - name: Resident worker lifecycle on Linux
        run: pytest backend/tests/unit/test_waymark_worker.py --junitxml=.ci-results/worker-linux.xml -ra
      - name: Build wheel and install isolated test venv (PR23-R3-TEST-001)
        run: |
          pip install build
          mkdir -p /tmp/test-pd-wheel-dist
          python -m build --wheel --no-isolation --outdir /tmp/test-pd-wheel-dist
          python -m venv --without-pip /tmp/test-pd-wheel-venv
          pip install --no-deps --force-reinstall --prefix /tmp/test-pd-wheel-venv /tmp/test-pd-wheel-dist/*.whl
          for script_bin in /tmp/test-pd-wheel-venv/bin/patchdiff*; do
            sed -i '1s|^.*$|#!/tmp/test-pd-wheel-venv/bin/python3|' "$script_bin"
            chmod +x "$script_bin"
          done
          BASE_SITES=$(python -c 'import sys; print("\n".join(p for p in sys.path if "site-packages" in p and "Patch-DIFF" not in p))')
          VENV_SITE=$(/tmp/test-pd-wheel-venv/bin/python3 -c 'import site; print([p for p in site.getsitepackages() if "test-pd-wheel-venv" in p][0])')
          echo "$BASE_SITES" > "$VENV_SITE/base-deps.pth"
          cat << 'EOF' > "$VENV_SITE/sitecustomize.py"
          import sys
          sys.path = [p for p in sys.path if 'Patch-DIFF' not in p and not p.endswith('/backend')]
          EOF
          /tmp/test-pd-wheel-venv/bin/python3 -m app.waymark_bridge.bootstrap --target-dir /tmp/test-pd-wheel-venv/waymark-bridge
          APP_DIR=$(/tmp/test-pd-wheel-venv/bin/python3 -c 'import app; from pathlib import Path; print(Path(app.__file__).parent)')
          cp -r /tmp/test-pd-wheel-venv/waymark-bridge/node_modules "$APP_DIR/waymark_bridge/"
      - name: Postgres integration tests
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: pytest backend/tests/integration --junitxml=.ci-results/integration-resident.xml -ra
      - name: Offline evaluation
        run: python backend/tests/verification/offline_eval.py | tee .ci-results/offline-eval.txt
      - name: Deterministic five-file verification (resident)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: python backend/tests/verification/structural_batch/verify.py --output .ci-results/five-file
      - name: Four-tool delegated editor and trusted scalar finalization (five files)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
          PATCHDIFF_MCP_RESPONSE_MODE: compact
        run: python backend/tests/verification/structural_batch/verify.py --host-finalize --output .ci-results/five-file-compact-host
      - name: Versioned editor interface and trusted scalar finalization (five files)
        env:
          PATCHDIFF_WAYMARK_MODE: resident
        run: python backend/tests/verification/structural_batch/verify.py --editor-v2 --host-finalize --output .ci-results/five-file-v2
      - name: Build documentation site check
        run: |
          pip install -r docs-requirements.lock
          zensical build
      - name: Executed source and environment
        if: always()
        run: |
          mkdir -p .ci-results
          git rev-parse HEAD > .ci-results/executed-source.txt
          python --version > .ci-results/environment.txt
          node --version >> .ci-results/environment.txt
          uname -a >> .ci-results/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-waymark-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
