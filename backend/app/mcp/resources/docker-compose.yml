services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchdiff}
      POSTGRES_USER: ${POSTGRES_USER:-patchdiff_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${PATCHDIFF_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-patchdiff_bootstrap} -d $${POSTGRES_DB:-patchdiff}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - patchdiff_postgres_data:/var/lib/postgresql/data

volumes:
  patchdiff_postgres_data:
