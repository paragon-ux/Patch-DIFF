[project]
site_name = "PatchDIFF Documentation"
site_url = "https://paragon-ux.github.io/Patch-DIFF"
site_description = "Transactional document-editing service for MCP-connected agents."
site_author = "Paragon UX"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
reviews/**
usability/**
"""

nav = [
    { "Home" = "index.md" },
    { "Visual Architecture & Flow" = "architecture.md" },
    { "Specifications" = [
        { "Core Runtime Spec" = "spec/core-runtime.md" },
        { "MCP Tools" = "spec/mcp-tools.md" },
        { "Data Model" = "spec/data-model.md" },
        { "PDCP Format" = "spec/transaction-formats.md" },
        { "Structural Batch Editing" = "spec/structural-batch-editing.md" },
        { "Waymark Worker" = "spec/waymark-worker.md" }
    ]},
    { "MCP Profiles" = [
        { "Profile Catalog" = "spec/profiles/index.md" },
        { "Workspace" = "spec/profiles/workspace-profile.md" },
        { "Editing an Existing Target" = "spec/profiles/existing-target-editing.md" },
        { "Delegated Editing and Lifecycle" = "spec/profiles/delegation-and-lifecycle.md" },
        { "Observed Editor v2" = "spec/profiles/observed-editor-v2.md" }
    ]},
    { "Guides" = [
        { "Workspace Editing" = "guides/workspace-quickstart.md" },
        { "Host Integration Guide" = "guides/host-integration-guide.md" },
        { "Claude Desktop Setup" = "guides/claude-desktop-setup.md" },
        { "Observed Editor Workflow" = "guides/observed-editor-workflow.md" }
    ]},
    { "Benchmarks" = [
        { "Modernized 2×2 Factorial Benchmark" = "benchmarks/modernized-benchmark-report.md" },
        { "Verification Test Matrix" = "benchmarks/test-matrix.md" }
    ]},
    { "Papers" = [
        { "Concept Paper v6" = "papers/concept-paper-v6.md" },
        { "Modernization Architecture" = "papers/modernization-architecture.md" },
        { "Modernization Change Record" = "papers/product-change-record.md" }
    ]},
    { "Standards" = [
        { "PR Review Standard" = "standards/pr-review-standard.md" },
        { "Release Readiness" = "standards/release-readiness.md" }
    ]},
    { "Legacy" = [
        { "Legacy Compatibility" = "legacy/LEGACY_COMPATIBILITY.md" },
        { "Historical Archive Index" = "legacy/ARCHIVE_INDEX.md" },
        { "Legacy Benchmark Report" = "legacy/git_benchmark_report.md" },
        { "Concept Paper v5" = "legacy/PatchDIFF-Concept-Paper-5.md" },
        { "Protocol Spec v0.2.3" = "legacy/PatchDIFF-Protocol-Spec-v0.2.3.md" },
        { "Implementation Spec v0.2.3" = "legacy/PatchDIFF-Implementation-Spec-v0.2.3.md" },
        { "Snapshot v0.2.3" = "legacy/PatchDIFF-Snapshot.md" }
    ]}
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Preserve public links to the previous documentation filenames.
[project.plugins.redirects.redirect_maps]
"benchmarks/TEST_MATRIX.md" = "benchmarks/test-matrix.md"
"benchmarks/modernized_benchmark_report.md" = "benchmarks/modernized-benchmark-report.md"
"guides/CLAUDE_DESKTOP_SETUP.md" = "guides/claude-desktop-setup.md"
"guides/HOST_INTEGRATION_GUIDE.md" = "guides/host-integration-guide.md"
"guides/OBSERVED_EDITOR_WORKFLOW.md" = "guides/observed-editor-workflow.md"
"guides/WORKSPACE_PUBLICATION.md" = "guides/workspace-quickstart.md"
"papers/MODERNIZATION_ARCHITECTURE.md" = "papers/modernization-architecture.md"
"papers/MODERNIZATION_CHANGE_DOC.md" = "papers/product-change-record.md"
"papers/PatchDIFF-Concept-Paper-6.md" = "papers/concept-paper-v6.md"
"spec/DATA_MODEL.md" = "spec/data-model.md"
"spec/MCP_TOOLS.md" = "spec/mcp-tools.md"
"spec/PATCHDIFF_CORE_SPEC.md" = "spec/core-runtime.md"
"spec/PDCP_FORMAT.md" = "spec/transaction-formats.md"
"spec/STRUCTURAL_BATCH_EDITING.md" = "spec/structural-batch-editing.md"
"spec/WAYMARK_WORKER.md" = "spec/waymark-worker.md"
"spec/profiles/MCP_EDITOR_V2.md" = "spec/profiles/observed-editor-v2.md"
"spec/profiles/WORKSPACE.md" = "spec/profiles/workspace-profile.md"
"standards/PR_REVIEW_STANDARD.md" = "standards/pr-review-standard.md"
"standards/RELEASE_READINESS.md" = "standards/release-readiness.md"
"spec/MCP_EDITOR_V2.md" = "spec/profiles/observed-editor-v2.md"
