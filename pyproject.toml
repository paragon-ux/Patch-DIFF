[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchdiff-mcp"
version = "0.1.0"
description = "MCP-first server-side deterministic document transaction service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
patchdiff = "app.mcp.external_adapter:main"

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4,<5",
    "pytest>=9.0.3,<10.0",
]

[project.urls]
Repository = "https://github.com/paragon-ux/Patch-DIFF"
Issues = "https://github.com/paragon-ux/Patch-DIFF/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = [
    "migrations/alembic.ini",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
    "waymark_bridge/*.mjs",
    "waymark_bridge/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q -p no:cacheprovider"
